<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Mí</title>
    <style>
        .about-card {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .about-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .about-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }
        .about-name {
            font-size: 24px;
            color: #333333;
            margin: 10px 0 5px;
        }
        .about-role {
            font-size: 14px;
            color: #007bff;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .about-bio {
            font-size: 14px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .about-social {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .about-btn {
            background: #007bff;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.3s;
        }
        .about-btn:hover {
            background: #0056b3;
        }
    </style>
<link type="text/css" rel="stylesheet" href="css/style.css"/>
</head>
<body>

    <div class="about-card">
        <div class="about-container">
            <!-- https://es.vecteezy.com/png/54088422-ordenador-portatil-demostracion-html-codigo-en-pantalla-programacion-y-web-desarrollo -->
            <img src="https://placeholder.com" alt="Mi Foto" class="about-avatar">
            <h2 class="about-name">kenneth</h2>
            <p class="about-role">maestro en computacion</p>
            <p class="about-bio">
             hola soy kenneth soy estudiante de basico y estoy aprendienso html mis gustos personales es escuchar musica, dibujar y aprender cosas nuevas 
              
            </p>
            <div class="about-social">
                <!-- Cambia los enlaces por tus redes sociales o contacto -->
                
              <a href="#" class="about-btn">Contactar</a>
              <a href="#" class="about-btn">Enlasar</a>
                <a href="#" class="about-btn">Ver más</a>
            </div>
        </div>
    </div>

<script type="text/javascript" src="js/script.js"></script>
</body>
</html>
